<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="37%" r="78%"><stop stop-color="#183D72"/><stop offset=".54" stop-color="#0A2044"/><stop offset="1" stop-color="#041126"/></radialGradient>
    <linearGradient id="ring" x1="180" y1="155" x2="1020" y2="1040" gradientUnits="userSpaceOnUse"><stop stop-color="#7CFAFF"/><stop offset=".3" stop-color="#22C9EB"/><stop offset=".69" stop-color="#5068FF"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
    <linearGradient id="cubeFront" x1="365" y1="390" x2="770" y2="820" gradientUnits="userSpaceOnUse"><stop stop-color="#0AD4D0"/><stop offset=".5" stop-color="#0879C8"/><stop offset="1" stop-color="#3544C5"/></linearGradient>
    <linearGradient id="cubeTop" x1="360" y1="338" x2="603" y2="512" gradientUnits="userSpaceOnUse"><stop stop-color="#87FFF5"/><stop offset="1" stop-color="#17A8E2"/></linearGradient>
    <linearGradient id="cubeRight" x1="760" y1="432" x2="772" y2="796" gradientUnits="userSpaceOnUse"><stop stop-color="#1557BD"/><stop offset="1" stop-color="#172C84"/></linearGradient>
    <linearGradient id="text" x1="353" y1="833" x2="830" y2="950" gradientUnits="userSpaceOnUse"><stop stop-color="white"/><stop offset=".45" stop-color="#A5F3FC"/><stop offset="1" stop-color="#D8B4FE"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="13" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity=".48"/></filter>
  </defs>
  <rect width="1200" height="1200" rx="250" fill="url(#bg)"/>
  <circle cx="600" cy="600" r="493" fill="none" stroke="#45DFF7" stroke-opacity=".13" stroke-width="2"/>
  <circle cx="600" cy="600" r="454" fill="none" stroke="url(#ring)" stroke-width="22" filter="url(#glow)"/>
  <circle cx="600" cy="600" r="414" fill="#061A38" fill-opacity=".5" stroke="#8BF6FF" stroke-opacity=".22" stroke-width="2"/>
  <!-- نقاط تقنية مضيئة -->
  <g fill="#72F9FF" filter="url(#glow)"><circle cx="286" cy="370" r="7"/><circle cx="905" cy="384" r="6"/><circle cx="266" cy="682" r="5"/><circle cx="908" cy="715" r="8"/><circle cx="373" cy="820" r="5"/><circle cx="833" cy="821" r="5"/></g>
  <!-- مكعب تطبيق ثلاثي الأبعاد -->
  <g filter="url(#shadow)">
    <path d="M602 310L823 438L602 567L381 438L602 310Z" fill="url(#cubeTop)"/>
    <path d="M381 438L602 567V827L381 698V438Z" fill="url(#cubeFront)"/>
    <path d="M602 567L823 438V698L602 827V567Z" fill="url(#cubeRight)"/>
    <path d="M602 337L777 438L602 540L427 438L602 337Z" fill="#A5FFF8" fill-opacity=".36"/>
  </g>
  <!-- رمز برامج: أقواس وكهرباء -->
  <g fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M523 588L464 639L523 690" stroke-width="25"/>
    <path d="M681 588L740 639L681 690" stroke-width="25"/>
    <path d="M633 569L570 713" stroke="#B6FFF9" stroke-width="23"/>
    <path d="M613 571L554 655H607L580 729L674 620H620L650 571Z" fill="#FFF8B5" stroke="#FFF8B5" stroke-width="8"/>
  </g>
  <path d="M448 751L601 839L755 751" fill="none" stroke="#69F9FF" stroke-opacity=".55" stroke-width="5"/>
  <!-- الاسم داخل الدائرة الآمنة لصورة فيسبوك -->
  <text x="600" y="968" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="url(#text)" font-family="Tahoma, Arial, sans-serif" font-size="104" font-weight="700">حل سريع</text>
  <text x="600" y="1025" text-anchor="middle" fill="#7DD3FC" font-family="Tahoma, Arial, sans-serif" font-size="27" font-weight="600" letter-spacing="5">SOFTWARE SOLUTIONS</text>
</svg>
